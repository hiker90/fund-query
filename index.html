<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>FundPilot · 基金策略管家</title>
    <meta
      name="description"
      content="本地优先的基金持仓监控与分档补仓策略工具：手动添加基金、设定交易策略、管理成本、一键刷新净值。"
    />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FundPilot" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="app" class="app"></div>

    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <a href="#/macro" data-tab="macro">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3.5 9h17" />
          <path d="M3.5 15h17" />
          <path d="M12 3a14.5 14.5 0 0 0 0 18a14.5 14.5 0 0 0 0-18" />
        </svg>
        <span>宏观</span>
      </a>
      <a href="#/holdings" data-tab="holdings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19V9" />
          <path d="M10 19V5" />
          <path d="M16 19v-7" />
          <path d="M22 19V7" />
        </svg>
        <span>持仓</span>
      </a>
      <a href="#/strategy" data-tab="strategy">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h10" />
          <path d="M18 7h2" />
          <path d="M4 17h4" />
          <path d="M12 17h8" />
          <circle cx="16" cy="7" r="2.4" />
          <circle cx="10" cy="17" r="2.4" />
        </svg>
        <span>策略</span>
      </a>
      <a href="#/allocation" data-tab="allocation">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 20H4" />
          <rect x="3" y="12" width="4" height="8" rx="1" />
          <rect x="9" y="6" width="4" height="14" rx="1" />
          <rect x="15" y="9" width="4" height="11" rx="1" />
        </svg>
        <span>配置</span>
      </a>
      <a href="#/data" data-tab="data">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="6" rx="7" ry="3" />
          <path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6" />
          <path d="M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6" />
        </svg>
        <span>数据</span>
      </a>
    </nav>

    <div id="sheet-root" class="sheet-root" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
